<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Awareness Lab</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: white;
            max-width: 400px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
        }

        input, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            background: #1877f2;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Phishing Awareness Lab</h2>
        <p>This is a cybersecurity training simulation.</p>
        <p>Use fictional training details only.</p>

        <input type="text" placeholder="Training username">
        <input type="password" placeholder="Dummy password">

        <button onclick="alert('Training complete! Never enter real passwords on suspicious websites.')">
            Complete Simulation
        </button>
    </div>
</body>
</html>
